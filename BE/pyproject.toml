[project]
name = "be"
version = "0.1.0"
description = "Backend ekstrakcji cech CLIP, redukcji UMAP 3D oraz API FastAPI dla zbioru VideoGameBunny"
readme = "README.md"
authors = [
    { name = "xSilverline" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
    "pydantic",
    "fastapi>=0.163.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.6.0",
]


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
