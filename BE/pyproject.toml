[project]
name = "be"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xSilverline", email = "szkarna@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
]

[project.scripts]
be = "be:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
